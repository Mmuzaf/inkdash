name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.6"
          enable-cache: true

      # Deliberately the only command: CI and local development share one contract.
      - name: make check
        run: make check

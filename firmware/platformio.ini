; Inkplate 10 firmware for the inkdash renderer.
;
; The platform and library versions are pinned rather than floated. The Inkplate
; library, the arduino-esp32 core and the panel's waveform handling are tightly
; coupled, and this particular combination is the one Soldered's own v11 board
; package targets.

[platformio]
; Soldered took the Inkplate line over from e-radionica in 2022, so a board bought
; new is the v2. See SETUP.md for how to tell them apart.
default_envs = inkplate10v2
src_dir = src


[inkdash]
; pioarduino fork of the espressif32 platform: 55.03.37 is arduino-esp32 3.3.7 /
; IDF 5.5.2, which is what the Inkplate v11 library expects.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
; The default 1.3MB app partition is too small once WiFiManager, PubSubClient and
; the Inkplate library are linked together. Nothing is stored on the flash
; filesystem, so the space is better spent on the application.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder, default

lib_deps =
  https://github.com/SolderedElectronics/Inkplate-Arduino-library.git#11.1.2
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  knolleary/PubSubClient @ 2.8
  bblanchon/ArduinoJson @ 7.4.3
  ricmoo/QRCode @ 0.0.1

extra_scripts = pre:version.py

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; PubSubClient's 256 byte default cannot hold a discovery payload.
  -DMQTT_MAX_PACKET_SIZE=1024


[env:inkplate10]
extends = inkdash
build_flags =
  ${inkdash.build_flags}
  -DARDUINO_INKPLATE10


[env:inkplate10v2]
extends = inkdash
build_flags =
  ${inkdash.build_flags}
  -DARDUINO_INKPLATE10V2
